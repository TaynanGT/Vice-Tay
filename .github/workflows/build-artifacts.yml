name: Build Test Artifacts

on:
  push:
    branches: [exp/perf-4060-16gb]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build diag & release victory.exe
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build diagnostics binary
        run: cargo build --locked --profile diag -p victory --features diagnostics
      - name: Build release binary
        run: cargo build --locked --release -p victory
      - name: Upload victory-diag.exe
        uses: actions/upload-artifact@v4
        with:
          name: victory-diag-windows-x64
          path: target/diag/victory.exe
          if-no-files-found: error
      - name: Upload victory-release.exe
        uses: actions/upload-artifact@v4
        with:
          name: victory-release-windows-x64
          path: target/release/victory.exe
          if-no-files-found: error
